# platform-org/.github/workflows/reusable-ci.yml
name: reusable-ci

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "24.x"
      working-directory:
        type: string
        default: "."

permissions:
  contents: read

jobs:
  guardrails:
    uses: ./.github/workflows/reusable-guardrails.yml
    with:
      working-directory: ${{ inputs.working-directory }}

  build-test:
    needs: guardrails
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

