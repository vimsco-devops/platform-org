# platform-org/.github/workflows/reusable-ci-java.yml
name: reusable-ci-java

on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: "25"
      working-directory:
        type: string
        default: "."

permissions:
  contents: read

jobs:
  guardrails:
    uses: ./.github/workflows/reusable-guardrails.yml
    with:
      working-directory: ${{ inputs.working-directory }}

  build-test:
    needs: guardrails
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven

      - name: Build and test
        run: mvn -B verify

